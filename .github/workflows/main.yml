name: Build Vcam_Mch (Rootless · iOS 15 · iPhone 7)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest      # Ubuntu nhanh hơn macOS nhiều

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Cache Theos ───────────────────────────────────────
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-ubuntu-v4-${{ hashFiles('**/Makefile') }}
          restore-keys: theos-ubuntu-v4-

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      # ── 3. Cache iOS 15.5 SDK ────────────────────────────────
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS15.5.sdk
          key: sdk-ios155-v2

      - name: Download iOS 15.5 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/theos/sdks
          curl -fsSL \
            "https://github.com/theos/sdks/releases/download/variantmacos-monolib/iPhoneOS15.5.sdk.tar.xz" \
            -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $GITHUB_WORKSPACE/theos/sdks

      # ── 4. Install deps (Ubuntu) ─────────────────────────────
      - name: Install ldid + dpkg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev fakeroot xz-utils zstd curl git perl make

          # ldid từ theos
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

          # clang cross-compiler cho arm64
          sudo apt-get install -y clang lld

      # ── 5. Build ─────────────────────────────────────────────
      - name: Build .deb (rootless, arm64)
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH=$THEOS/bin:$PATH
          export ARCHS=arm64
          export TARGET="iphone:clang:15.5:15.0"
          export THEOS_PACKAGE_SCHEME=rootless
          export SYSROOT=$THEOS/sdks/iPhoneOS15.5.sdk
          export STRIP=0

          mkdir -p packages

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            STRIP=0 \
            2>&1 | tee build.log

          echo "---BUILD EXIT: $?---"
          ls -la packages/ || true

      # ── 6. Upload log (always) ───────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      # ── 7. Upload .deb ───────────────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Vcam_Mch-rootless-${{ github.run_number }}
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      # ── 8. Print info ────────────────────────────────────────
      - name: Show .deb info
        if: always()
        run: |
          for deb in packages/*.deb; do
            [ -f "$deb" ] || continue
            echo "===== $deb ====="
            dpkg-deb --info "$deb" || true
            dpkg-deb --contents "$deb" | head -30 || true
          done
